spring.application.name=resume-analyzer

server.port=8080

# --- Database ---
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:resume_analyzer_dev}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema (via db/migration/*.sql) — Hibernate must only VALIDATE
# it matches the entities, never auto-generate or alter tables itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

spring.flyway.enabled=true

# --- JWT ---
jwt.secret=${JWT_SECRET:replace_with_a_long_random_string_at_least_32_chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
