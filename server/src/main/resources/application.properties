spring.application.name=resume-analyzer

# Hosts such as Render provide PORT; locally the server stays on 8080.
server.port=${PORT:8080}

# --- Database ---
# DB_URL overrides the individual settings below, because hosted databases
# need TLS options on the URL.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:resume_analyzer_dev}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema (via db/migration/*.sql) — Hibernate must only VALIDATE
# it matches the entities, never auto-generate or alter tables itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

spring.flyway.enabled=true

# --- JWT ---
# No default: the app must refuse to start without a real secret.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
# Comma-separated list of allowed frontend origins, for example https://my-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB